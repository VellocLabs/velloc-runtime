<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Velloc</title>
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        opacity: 0.75;
        margin: 0;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <!--
      The site root: the product loads only from /v<N>/, so this page answers a
      human who types the bare domain. Static and dependency-free; staged
      verbatim by scripts/stage_deploy.mjs, outside any bundle.
    -->
    <main>
      <h1>Velloc</h1>
      <p>
        This host serves the Velloc agent runtime to the Velloc browser.
        There is nothing to open here — visit
        <a href="https://velloc.app">velloc.app</a>.
      </p>
    </main>
  </body>
</html>
